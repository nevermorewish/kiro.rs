services:
  kiro-rs:
    image: crpi-dzjyl2rfnlfugj1m.cn-shanghai.personal.cr.aliyuncs.com/frogclaw/kirors:latest
    container_name: kiro-rs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CONFIG_FILE: /app/config/config.json
      CREDENTIALS_FILE: /app/data/credentials.json
    ports:
      - "8990:8990"
    volumes:
      - ./config.example.json:/app/config/config.json:ro
      - kiro-rs-data:/app/data
    restart: unless-stopped

volumes:
  kiro-rs-data:
